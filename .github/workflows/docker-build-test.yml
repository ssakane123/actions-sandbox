name: Docker Build Test
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build only
        uses: docker/build-push-action@v7
        with:
          context: docker-sample
          push: false
